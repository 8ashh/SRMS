<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Academic Analytics & SRMS | MITS Gwalior</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #EFF6FF 0%, #F8FAFC 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 2.25rem 2rem;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
    }
    .demo-pill {
      font-size: 0.78rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #E2E8F0;
      background: #F8FAFC;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-pill:hover {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #1D4ED8;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-2 rounded-3 bg-primary bg-opacity-10 text-primary mb-3">
        <i class="bi bi-mortarboard-fill fs-4"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">MITS Gwalior</h4>
      <p class="text-muted small mb-0">Academic Performance Analytics & SRMS</p>
    </div>

    <!-- Flash messages -->
    {% include 'components/flash_messages.html' %}

    <!-- Form -->
    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
      <div class="mb-3">
        <label for="username" class="form-label">Username or Roll Number</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="e.g. admin, faculty_sharma, ai23001" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-navy w-100 py-2 fw-semibold mb-3">
        Sign In
      </button>
    </form>

    <!-- Quick Demo Accounts Switcher -->
    <div class="pt-3 border-top text-center">
      <div class="text-muted small mb-2" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;">Demo Accounts</div>
      <div class="d-flex justify-content-center gap-2">
        <button type="button" class="demo-pill" onclick="fillCreds('admin', 'admin123')">
          <i class="bi bi-shield-check me-1 text-primary"></i>Admin
        </button>
        <button type="button" class="demo-pill" onclick="fillCreds('faculty_sharma', 'faculty123')">
          <i class="bi bi-person-badge me-1 text-success"></i>Faculty
        </button>
        <button type="button" class="demo-pill" onclick="fillCreds('ai23001', 'AI23001@123')">
          <i class="bi bi-mortarboard me-1 text-info"></i>Student
        </button>
      </div>
    </div>
  </div>

  <div class="text-center mt-3 text-muted small" style="font-size: 0.76rem;">
    Department of Computer Science & Engineering &bull; MITS Gwalior
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
